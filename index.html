<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBA 4</title>

    <link href="styles.css" rel="stylesheet">
    <script src="app.js" defer></script>
</head>
<body>
    <h1>Task Management App</h1>
    <!-- Input fields for task name, category, deadline, and status.-->
    <input id="taskInput" type="text" placeholder="Enter the task name." required/>
    <input id="categoryInput" type="text" placeholder="Enter the category." required/>
    <input id="deadlineInput" type="date" placeholder="Enter the deadline." required/>
    
    <select id="statusInput">
        <option value="Not Started">Not Started</option>
        <option value="In Progress">In Progress</option>
        <option value="Completed">Completed</option>
    </select>

    <!-- A button to add new tasks.-->
    <button id="addTaskButton" type="button">Add Task</button>

    <!-- A dropdown or buttons to filter tasks by status or category.-->
    <h2>Filter Tasks</h2>
    <label for="task-select">Group items:</label>

    <select name="tasks" id="task-select">
        <option value="">--PLease select status or category--</option>
        <option value="status">Status</option>
        <option value="category">Category</option>
    </select>

    <label for="filterValue">Filter by:</label>
    <select id="filterValue">
        <option value="">--Select a filter--</option>
    </select>

    <!-- A display area to show the list of tasks, including options to update task status.-->
    <h2>Task List</h2>
    <ul id="tasks">Tasks</ul>
</body>
</html>
